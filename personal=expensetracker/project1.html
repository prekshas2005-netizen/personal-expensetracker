<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Personal Expense Tracker</span>
    </div>
  </nav>
 
  <div class="container my-4">
    <div class="row g-4">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Add Expense</h5>
            <form id="expenseForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input type="number" class="form-control" id="amount" min="1" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" id="category" required>
                  <option value="">Choose...</option>
                  <option>Food</option>
                  <option>Transport</option>
                  <option>Shopping</option>
                  <option>Bills</option>
                  <option>Entertainment</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Add Expense</button>
            </form>
          </div>
        </div>
 
        <div class="card shadow-sm mt-3">
          <div class="card-body">
            <h5 class="card-title">Summary</h5>
            <p class="mb-1">Total Spent: <strong id="totalSpent">₹0</strong></p>
            <p class="mb-1">Entries: <strong id="entryCount">0</strong></p>
            <hr/>
            <div id="categoryBreakdown"></div>
          </div>
        </div>
      </div>
 
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Your Expenses</h5>
              <select id="filterCategory" class="form-select w-auto">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th class="text-end">Amount</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="expenseTable"></tbody>
              </table>
              <p id="emptyMsg" class="text-muted text-center">No expenses yet. Add one to get started.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script2.js"></script>
</body>
</html>
